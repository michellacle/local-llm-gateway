[project]
name = "local-llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM API multiplexer for local-network model servers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Local LLM Gateway Contributors" }
]
keywords = ["llm", "openai", "fastapi", "proxy", "multiplexer", "local-llm", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
local-llm-gateway = "local_llm_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/michellacle/local-llm-gateway"
Repository = "https://github.com/michellacle/local-llm-gateway"
Issues = "https://github.com/michellacle/local-llm-gateway/issues"

[tool.hatch.build.targets.wheel]
packages = ["local_llm_gateway"]

[tool.hatch.build.targets.sdist]
include = [
    "/local_llm_gateway",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/config.example.json",
    "/scripts",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
