<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Review — Local LLM Gateway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      background: #0d1117; color: #c9d1d9; padding: 1.5rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; color: #58a6ff; }
    .nav { margin-bottom: 1rem; }
    .nav a { color: #58a6ff; text-decoration: none; margin-right: 1rem; font-size: .85rem; }
    .nav a:hover { text-decoration: underline; }
    #status { font-size: .85rem; color: #8b949e; margin: .75rem 0; min-height: 1.2em; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .controls { margin: 1rem 0; display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; }
    button {
      background: #238636; color: #fff; border: none; padding: .5rem 1rem;
      border-radius: 6px; cursor: pointer; font-size: .85rem;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #484f58; cursor: not-allowed; }
    button.secondary { background: #30363d; }
    button.secondary:hover { background: #484f58; }
    button.danger { background: #da3633; }
    button.danger:hover { background: #f85149; }
    button.pin-btn { background: #1f6feb; }
    button.pin-btn:hover { background: #388bfd; }
    button.pin-btn.pinned { background: #d29922; }
    button.pin-btn.pinned:hover { background: #e3b341; }
    select, input[type="text"] {
      background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
      padding: .35rem .5rem; border-radius: 6px; font-size: .85rem;
    }
    label { font-size: .85rem; color: #8b949e; }
    .form-group { display: flex; flex-direction: column; gap: .25rem; }
    .form-group label { font-size: .75rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: .4rem .6rem; text-align: left; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 600; }
    tr:hover td { background: #161b22; }
    .badge { display: inline-block; font-size: .7rem; padding: .15rem .4rem; border-radius: 12px; background: #30363d; color: #8b949e; }
    .badge.pinned { background: #d29922; color: #0d1117; }
    .capture-row { cursor: pointer; }
    .capture-detail { display: none; }
    .capture-detail pre {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: .75rem; margin: .5rem 0; overflow-x: auto; font-size: .8rem;
      white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto;
    }
    .capture-detail .meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .capture-detail .meta span { font-size: .8rem; color: #8b949e; }
    .capture-detail .meta strong { color: #c9d1d9; }
    .pagination { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; }
    .pagination button { padding: .35rem .75rem; font-size: .8rem; }
    .empty-state { text-align: center; padding: 2rem; color: #8b949e; }
  </style>
</head>
<body>
  <h1>Request Review</h1>
  <div class="nav">
    <a href="/">Dashboard</a>
    <a href="/upstreams">Upstreams</a>
    <a href="/smoketest">Smoke Test</a>
    <a href="/benchmark">Benchmark</a>
    <a href="/health">Health</a>
  </div>

  <div class="card">
    <div class="controls">
      <div class="form-group">
        <label>Filter</label>
        <select id="filter-type">
          <option value="all">All requests</option>
          <option value="pinned">Pinned only</option>
        </select>
      </div>
      <div class="form-group">
        <label>Model (search)</label>
        <input type="text" id="filter-model" placeholder="e.g. llama3" style="width:160px">
      </div>
      <div class="form-group">
        <label>Limit</label>
        <select id="limit-select">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </div>
      <button id="btn-refresh" class="secondary">Refresh</button>
    </div>
    <div id="status">Loading...</div>
  </div>

  <div class="card">
    <table id="captures-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>Model</th>
          <th>Backend</th>
          <th>Temp</th>
          <th>Thinking</th>
          <th>Pinned</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="captures-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none;">
      No requests captured yet. Send a chat completion request to see it here.
    </div>
    <div class="pagination">
      <button id="btn-prev" class="secondary" disabled>← Previous</button>
      <span id="page-info" style="font-size:.85rem; color:#8b949e;">Page 1</span>
      <button id="btn-next" class="secondary" disabled>Next →</button>
    </div>
  </div>

  <div id="detail-panel" class="card capture-detail">
    <h2 style="font-size:.95rem; color:#8b949e; margin-bottom:.75rem; text-transform:uppercase; letter-spacing:.05em;">Request Details</h2>
    <div class="meta" id="detail-meta"></div>
    <h3 style="font-size:.85rem; color:#8b949e; margin:.75rem 0 .25rem;">Prompt (messages)</h3>
    <pre id="detail-prompt"></pre>
    <h3 style="font-size:.85rem; color:#8b949e; margin:.75rem 0 .25rem;">Response</h3>
    <pre id="detail-response"></pre>
    <button id="btn-close-detail" class="secondary" style="margin-top:.5rem;">Close</button>
  </div>

  <script src="/requests.js"></script>
</body>
</html>
