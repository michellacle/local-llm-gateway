<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local LLM Gateway — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      background: #0d1117; color: #c9d1d9; padding: 1.5rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; color: #58a6ff; }
    #status { font-size: .8rem; color: #8b949e; margin-bottom: 1.25rem; }
    h2 { font-size: 1rem; margin: 1.25rem 0 .5rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: .35rem .6rem; text-align: left; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 600; }
    tr:hover td { background: #161b22; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    #recent-table { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Local LLM Gateway</h1>
  <div class="nav" style="margin-bottom:.75rem">
    <a href="/smoketest" style="color:#58a6ff;text-decoration:none;margin-right:1rem;font-size:.85rem">Smoke Test</a>
    <a href="/benchmark" style="color:#58a6ff;text-decoration:none;margin-right:1rem;font-size:.85rem">Benchmark</a>
    <a href="/health" style="color:#58a6ff;text-decoration:none;margin-right:1rem;font-size:.85rem">Health</a>
  </div>
  <div id="status">Connecting&hellip;</div>

  <div class="card">
    <h2>Overall</h2>
    <table id="overall-table"></table>
  </div>

  <div class="card">
    <h2>Per Model</h2>
    <table id="permodel-table"><thead></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Recent Requests</h2>
    <table id="recent-table"><thead></thead><tbody></tbody></table>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
