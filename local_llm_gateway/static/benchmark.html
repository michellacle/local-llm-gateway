<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmark — Local LLM Gateway</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0d1117; color: #c9d1d9; padding: 1.5rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: .5rem; color: #58a6ff; }
    .nav { margin-bottom: 1rem; }
    .nav a { color: #58a6ff; text-decoration: none; margin-right: 1rem; font-size: .85rem; }
    .nav a:hover { text-decoration: underline; }
    .controls { margin: 1rem 0; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    button {
      background: #238636; color: #fff; border: none; padding: .5rem 1rem;
      border-radius: 6px; cursor: pointer; font-size: .85rem;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #484f58; cursor: not-allowed; }
    label { font-size: .85rem; color: #8b949e; }
    select, input[type="number"], input[type="text"] {
      background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
      padding: .35rem .5rem; border-radius: 6px; font-size: .85rem;
    }
    input[type="checkbox"] { margin-right: .25rem; }
    #status { font-size: .85rem; color: #8b949e; margin: .75rem 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { padding: .4rem .6rem; text-align: left; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 600; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
    .stat-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: .75rem; }
    .stat-box .label { font-size: .75rem; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; }
    .stat-box .value { font-size: 1.3rem; font-weight: 600; color: #58a6ff; margin-top: .25rem; }
    .stat-box .value.warn { color: #f85149; }
    .stat-box .value.ok { color: #3fb950; }
  </style>
</head>
<body>
  <h1>Benchmark</h1>
  <div class="nav">
    <a href="/">Dashboard</a>
    <a href="/smoketest">Smoke Test</a>
    <a href="/health">Health</a>
  </div>

  <div class="controls">
    <button id="btn-run">Run Benchmark</button>
    <label>
      Model:
      <select id="sel-model" style="width:260px"></select>
    </label>
    <label>
      Iterations: <input type="number" id="inp-iter" value="5" min="1" max="100" style="width:60px">
    </label>
    <label>
      Max tokens: <input type="number" id="inp-tokens" value="256" min="16" max="4096" style="width:70px">
    </label>
    <label>
      <input type="checkbox" id="inp-stream"> Stream
    </label>
    <label>
      Prompt: <input type="text" id="inp-prompt" value="Explain quantum computing in three sentences." style="width:320px">
    </label>
  </div>

  <div id="status">Ready</div>

  <div class="card" id="summary-card" style="display:none">
    <div class="stat-grid" id="stat-grid"></div>
  </div>

  <div class="card">
    <table id="results-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Latency</th>
          <th>TTFT</th>
          <th>In Tokens</th>
          <th>Out Tokens</th>
          <th>Tokens/s</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <tr><td colspan="7">No benchmark run yet. Select a model and click "Run Benchmark".</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/benchmark.js"></script>
</body>
</html>
